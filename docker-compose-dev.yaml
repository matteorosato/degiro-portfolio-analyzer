services:
  app:
    build: .
    image: ghcr.io/matteorosato/degiro-portfolio-analyzer:latest
    container_name: portfolio-analyzer-container
    ports:
      - "8501:8501"     # Streamlit (public)
    expose:
      - "8000"          # FastAPI (internal only)
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped